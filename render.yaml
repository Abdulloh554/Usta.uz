# Render blueprint for the Ustamiz API.
#
# This mirrors the live service (Docker runtime, Oregon) so the two do not drift.
#
# `src/config/env.ts` validates the whole environment at boot and throws rather
# than starting half-configured, so every variable it has no default for is
# declared here — wired to another Render resource, generated, or `sync: false`
# so Render asks for it once instead of keeping a secret in the repository.
#
# Everything the schema defaults (Payme, Click, Cloudinary, FCM, Sentry, the
# matching tuning knobs) is deliberately left out: declaring it as `sync: false`
# would make Render demand a value for every unused credential before the
# blueprint could be created. Add those in the dashboard once the accounts exist.
services:
  # ─── API ─────────────────────────────────────────────────────────────────
  - name: ustauz-api
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    # Reports Mongo and Redis separately, so a failing check distinguishes
    # "the process is up" from "the process can actually serve traffic".
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Matches EXPOSE in the Dockerfile; the app reads it via the env schema.
      - key: PORT
        value: '4000'
      - key: API_PREFIX
        value: /api/v1
      - key: LOG_LEVEL
        value: info
      # The free plan sleeps after 15 idle minutes; the server pings its own
      # /health (RENDER_EXTERNAL_URL, set by Render) this often. 0 turns it off.
      - key: SELF_PING_MINUTES
        value: '10'

      # Atlas connection string, with the database name and credentials.
      - key: MONGO_URI
        sync: false

      - key: REDIS_URL
        fromService:
          name: ustauz-keyvalue
          type: keyvalue
          property: connectionString

      # 256-bit base64, comfortably past the 32-character minimum the schema
      # enforces. Rotating either one invalidates the matching tokens.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: BCRYPT_ROUNDS
        value: '12'

      # Required in production: the web, admin and landing domains, comma-separated.
      # An empty value allows every browser origin (the server logs a warning at
      # start-up). The mobile app sends no Origin header and is unaffected.
      - key: CORS_ORIGINS
        sync: false

      # Verification codes (password reset) go out by email. Eskiz SMS needs a
      # registered company, so SMS stays off: SMS_PROVIDER=console.
      - key: SMS_PROVIDER
        value: console
      - key: MAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: '465'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

      # The per-job fee a pro pays on accept; 0 turns payments off.
      - key: ORDER_ACCEPT_FEE
        value: '0'
      # Manual top-ups: MANUAL_PAYMENT_CARD / _HOLDER / _NOTE are added in the
      # dashboard (Environment) once the card exists; they default to empty.

  # ─── Redis ───────────────────────────────────────────────────────────────
  - name: ustauz-keyvalue
    type: keyvalue
    plan: free
    region: oregon
    # Only the API talks to it, over the private network.
    ipAllowList: []
    # BullMQ keeps job state here; evicting a key under memory pressure would
    # silently drop a queued match, so nothing may be evicted.
    maxmemoryPolicy: noeviction
