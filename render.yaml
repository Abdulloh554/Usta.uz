# Render blueprint for the Usta.uz API.
#
# This mirrors the live service (Docker runtime, Oregon) so the two do not drift.
#
# `src/config/env.ts` validates the whole environment at boot and throws rather
# than starting half-configured, so every variable it has no default for is
# declared here — wired to another Render resource, generated, or `sync: false`
# so Render asks for it once instead of keeping a secret in the repository.
#
# Everything the schema defaults (Payme, Click, Cloudinary, FCM, Sentry, the
# matching tuning knobs) is deliberately left out: declaring it as `sync: false`
# would make Render demand a value for every unused credential before the
# blueprint could be created. Add those in the dashboard once the accounts exist.
services:
  # ─── API ─────────────────────────────────────────────────────────────────
  - name: ustauz-api
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    # Reports Mongo and Redis separately, so a failing check distinguishes
    # "the process is up" from "the process can actually serve traffic".
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Matches EXPOSE in the Dockerfile; the app reads it via the env schema.
      - key: PORT
        value: '4000'
      - key: API_PREFIX
        value: /api/v1
      - key: LOG_LEVEL
        value: info

      # Atlas connection string, with the database name and credentials.
      - key: MONGO_URI
        sync: false

      - key: REDIS_URL
        fromService:
          name: ustauz-keyvalue
          type: keyvalue
          property: connectionString

      # 256-bit base64, comfortably past the 32-character minimum the schema
      # enforces. Rotating either one invalidates the matching tokens.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: BCRYPT_ROUNDS
        value: '12'

      # An empty value allows every origin, which is what the mobile app needs
      # until the landing page has a domain of its own.
      - key: CORS_ORIGINS
        sync: false

      # Eskiz refuses an empty account, so the credentials have to land in the
      # same change that selects the provider.
      - key: SMS_PROVIDER
        value: eskiz
      - key: ESKIZ_EMAIL
        sync: false
      - key: ESKIZ_PASSWORD
        sync: false
      - key: ESKIZ_FROM
        value: '4546'

      - key: ORDER_ACCEPT_FEE
        value: '4999'

  # ─── Redis ───────────────────────────────────────────────────────────────
  - name: ustauz-keyvalue
    type: keyvalue
    plan: free
    region: oregon
    # Only the API talks to it, over the private network.
    ipAllowList: []
    # BullMQ keeps job state here; evicting a key under memory pressure would
    # silently drop a queued match, so nothing may be evicted.
    maxmemoryPolicy: noeviction
